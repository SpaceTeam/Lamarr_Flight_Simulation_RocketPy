#:schema ../../simulation_core/config_schemas/config.schema.json
# Hover a key for its meaning and unit (Tombi); TOML syntax and variations: see README.md.
project = "CANSAT"
output_level = 2

[environment]
date = 2026-03-08T12:00:00
latitude = 48.3990720
longitude = 13.4526260
max_expected_height = 700
elevation = 339.91
timezone = "Europe/Berlin"
envType = ["Windy", "custom_atmosphere"]
# envType = ["reanalysis"]
windy_weather_models = ["ICONEU"]
custom_weather_models = ["icon_d2", "icon_eu"]
# reanalysis_file = "cansat_weather.nc"
# reanalysis_dictionary = "ECMWF"

[engine]
type = "solid"

# K700W values are from https://www.thrustcurve.org/motors/AeroTech/K700W/.
[motor]
name = "K700W"
total_mass = 2035
propellant_mass = 1291
diameter = 54
length = 568
burn_time = 3.3
center_of_dry_mass_factor = 0.4
thrust = "AeroTech_K700W.eng"

[rocket]
total_mass_without_motor = 16000                            # weighed
length = 2090                                               # measured
total_CG_without_motor_from_tip = 1180                      # measured
diameter = 152                                              # measured
moment_of_intertia_Z = 0.0255                               # calculated
moment_of_intertia_XY = 16.8                                # calculated
power_off_drag = "power_off_drag.csv"
power_on_drag = "power_on_drag.csv"

[nosecone]
length = 230                                                # measured
cylindrical_section_length = 0
kind = "elliptical"

[railbuttons]
upper_from_tip = 590
lower_from_tip = 1590

[tailcone]
bottom_radius = 75                                          # measured
cylindrical_section_length = 0                              # Onshape
length = 10                                                 # measured

[fins]
amount = 3
position = 465                                              # Onshape
name = "Freeform"
shape_points = [[0, 0], [0.145, 0.155], [0.510, 0.155], [0.510, 0.100], [0.410, 0]]

[parachutes.main]
cd_s = 6.911503837897546
trigger = 150
sampling_rate = 105

[parachutes.drogue]
cd_s = 0.336875
trigger = "apogee"
sampling_rate = 105

[parachutes.payload]
cd_s = "0.05..0.08:0.01"                                    # cd=0.62, Amin=0.08 m^2, Amax=0.14 m^2
trigger = "apogee"
sampling_rate = 105

[flight]
rail_length = 6
inclination = "84..88:2"
# heading = "0..350:10"
heading = "90..180:30"

[payload]
mass_total = 1800                                           # 300 g * 6
mass = "300..350:10"
diameter = 66
length = 115
moment_of_intertia_Z = 0.01
moment_of_intertia_XY = 0.01
