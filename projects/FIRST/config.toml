#:schema ../../simulation_core/config_schemas/config.schema.json
# Hover a key for its meaning and optional unit (Tombi); TOML syntax and variations: see Documentation.md.
project = "FIRST"
output_level = 2

[environment]
# date = 2026-03-08T12:00:00
date = "tomorrow_08_local"
latitude = 48.8038043
longitude = 12.5487077
max_expected_height = 1000
elevation = 355.45
timezone = "Europe/Berlin"
envType = ["Windy", "custom_atmosphere"]
windy_weather_models = ["ICONEU"]
custom_weather_models = ["icon_d2", "icon_eu"]

[engine]
type = "solid"

[motor]
name = "H238T"
total_mass = 196
propellant_mass = 83
diameter = 29
length = 194
burn_time = 1
center_of_dry_mass_factor = 0.5
thrust = "thrust.csv"

[rocket]
