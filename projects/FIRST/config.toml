cylindrical_section_length = 0              # measured
kind = "vonkarman"

[railbuttons]
upper_from_tip = 412                        # measured
lower_from_tip = 912                        # measured

[tailcone]
bottom_radius = 27.5                        # measured
cylindrical_section_length = 0              # measured
length = 22

[fins]
