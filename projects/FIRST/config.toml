shape_points = [[0, 0], [0.0281, 0.00618],              # measured
                [0.0529, 0.0129], [0.0782, 0.0224], 
                [0.0979, 0.0309], [0.119, 0.0416], 
                [0.135, 0.0517], [0.148, 0.0568], 
                [0.157, 0.059], [0.176, 0.059], 
                [0.178, 0.0556], [0.181, 0.0432], 
                [0.182, 0.0321], [0.182, 0.0169], 
                [0.177, 0], [0, 0]
                ]

[parachutes.main]
